name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nvim: "0.11.7"
            asset: nvim-linux-x86_64
          - os: ubuntu-latest
            nvim: "0.12.5"
            asset: nvim-linux-x86_64
          - os: macos-14
            nvim: "0.11.7"
            asset: nvim-macos-arm64
          - os: macos-14
            nvim: "0.12.5"
            asset: nvim-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        env:
          NVIM_VERSION: ${{ matrix.nvim }}
        run: |
          asset="${{ matrix.asset }}"
          curl -fsSLO "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/${asset}.tar.gz"
          tar -xzf "${asset}.tar.gz"
          echo "$PWD/${asset}/bin" >> "$GITHUB_PATH"
          nvim --version | head -n 1
      - name: Run headless tests
        run: nvim --headless -u NONE -l tests/run.lua

  dogfood:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            nvim: "0.11.7"
            bend: "2.0.28"
            archive: bend-2.0.28-linux-x64.tar.gz
            sha256: 22bb6d5f6bce8ae2c5b340371fedddcbd90edc07a48b6e2b351a944c4558a3eb
          - os: ubuntu-latest
            nvim: "0.11.7"
            bend: "2.0.32"
            archive: bend-2.0.32-linux-x64.tar.gz
            sha256: 5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6
          - os: ubuntu-latest
            nvim: "0.12.5"
            bend: "2.0.28"
            archive: bend-2.0.28-linux-x64.tar.gz
            sha256: 22bb6d5f6bce8ae2c5b340371fedddcbd90edc07a48b6e2b351a944c4558a3eb
          - os: ubuntu-latest
            nvim: "0.12.5"
            bend: "2.0.32"
            archive: bend-2.0.32-linux-x64.tar.gz
            sha256: 5c365ddb12954d0933cef751802e0f7d9875f842edcb80f9661f89cd1a9ff7b6
          - os: macos-14
            nvim: "0.11.7"
            bend: "2.0.28"
            archive: bend-2.0.28-darwin-arm64.tar.gz
            sha256: b7f6cece79523ff1bb66a2754073f607683015982028111eee2149114dbdb847
          - os: macos-14
            nvim: "0.11.7"
            bend: "2.0.32"
            archive: bend-2.0.32-darwin-arm64.tar.gz
            sha256: d7debc002f59264f648dc94e45c2a9fab23e4b1ee0a390bf2acd8b1673e0cf55
          - os: macos-14
            nvim: "0.12.5"
            bend: "2.0.28"
            archive: bend-2.0.28-darwin-arm64.tar.gz
            sha256: b7f6cece79523ff1bb66a2754073f607683015982028111eee2149114dbdb847
          - os: macos-14
            nvim: "0.12.5"
            bend: "2.0.32"
            archive: bend-2.0.32-darwin-arm64.tar.gz
            sha256: d7debc002f59264f648dc94e45c2a9fab23e4b1ee0a390bf2acd8b1673e0cf55
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        env:
          NVIM_VERSION: ${{ matrix.nvim }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then asset="nvim-macos-arm64"; else asset="nvim-linux-x86_64"; fi
          curl -fsSLO "https://github.com/neovim/neovim/releases/download/v${NVIM_VERSION}/${asset}.tar.gz"
          tar -xzf "${asset}.tar.gz"
          echo "$PWD/${asset}/bin" >> "$GITHUB_PATH"
      - name: Install checksum-verified Bend
        env:
          BEND_VERSION: ${{ matrix.bend }}
          BEND_ARCHIVE: ${{ matrix.archive }}
          BEND_SHA256: ${{ matrix.sha256 }}
        run: |
          curl -fsSLo "$BEND_ARCHIVE" "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/${BEND_ARCHIVE}"
          echo "$BEND_SHA256  $BEND_ARCHIVE" | shasum -a 256 --check
          mkdir bend-dist
          tar -xzf "$BEND_ARCHIVE" -C bend-dist
          echo "$PWD/bend-dist/bend/bin" >> "$GITHUB_PATH"
          printf 'BEND_DOGFOOD_VERSION=%s\n' "$BEND_VERSION" >> "$GITHUB_ENV"
      - name: Run compiler dogfood
        run: nvim --headless -u NONE -l tests/dogfood.lua
